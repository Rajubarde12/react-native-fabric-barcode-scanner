buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

// ---------------------------------------------------------------------------
// Dependency versions (bump here; see DEPENDENCY_AUDIT.md)
// CameraX 1.6.1 — latest stable (Jul 2026). minSdk floor for CameraX defaults
// is API 23; this library keeps API 24 to match RN 0.76+.
// ML Kit barcode-scanning 17.3.0 — latest *bundled* model (offline, larger APK).
// Unbundled alternative: play-services-mlkit-barcode-scanning:18.3.1
// ---------------------------------------------------------------------------
def cameraxVersion = "1.6.1"
def mlkitBarcodeVersion = "17.3.0"

android {
    namespace "com.rncustomscanner"
    compileSdk safeExtGet("compileSdkVersion", 36)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 36)
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            java {
                if (isNewArchitectureEnabled()) {
                    srcDirs += [
                        "src/newarch/java",
                        "${project.buildDir}/generated/source/codegen/java",
                    ]
                } else {
                    srcDirs += ["src/oldarch/java"]
                }
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

def kotlinVersion = safeExtGet("kotlinVersion", "2.1.20")

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    // Bundled ML Kit model — works offline; ~2–3MB native libs in APK.
    // For smaller APK + Play Services download, swap to:
    //   implementation "com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1"
    implementation "com.google.mlkit:barcode-scanning:$mlkitBarcodeVersion"
}
